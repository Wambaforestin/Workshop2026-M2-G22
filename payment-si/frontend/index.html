<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boutique Fictive — Paiement</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Boutique Fictive SAS</h1>
      <p class="text-slate-500 text-sm">Démonstrateur Resilience-Alpha — paiement simulé (aucune donnée réelle)</p>
    </header>

    <div id="status" class="mb-4 text-sm px-3 py-2 rounded bg-slate-200 text-slate-700">
      État du service : vérification…
    </div>

    <section class="bg-white rounded-xl shadow p-5 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Montant (EUR fictifs)</label>
        <input id="amount" type="number" value="42.00" step="0.01"
               class="w-full border rounded px-3 py-2" />
      </div>
      <button id="pay"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded">
        Payer le marchand
      </button>
      <pre id="result" class="text-xs bg-slate-900 text-emerald-300 rounded p-3 overflow-x-auto min-h-[3rem]"></pre>
    </section>

    <p class="text-xs text-slate-400 mt-4">
      Comptes de démo : client <code>acc-client-001</code> → marchand <code>acc-merchant-001</code>.
    </p>
  </div>

  <script>
    // L'URL de l'API passe par le WAF (reverse-proxy) en production ; en démo
    // locale on cible le port publié de l'API.
    const API = window.PAYMENT_API || "http://localhost:8080";
    const AUTH = window.AUTH_API || "http://localhost:8100";

    async function refreshStatus() {
      const el = document.getElementById("status");
      try {
        const r = await fetch(API + "/health/deep");
        if (r.ok) {
          const j = await r.json();
          el.className = "mb-4 text-sm px-3 py-2 rounded bg-emerald-100 text-emerald-800";
          el.textContent = "État du service : disponible (" + j.accounts + " comptes)";
        } else {
          throw new Error("deep KO");
        }
      } catch (e) {
        el.className = "mb-4 text-sm px-3 py-2 rounded bg-red-100 text-red-800";
        el.textContent = "État du service : indisponible — incident en cours";
      }
    }

    async function pay() {
      const out = document.getElementById("result");
      out.textContent = "Traitement…";
      try {
        const login = await fetch(AUTH + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: "merchant", password: "merchant-demo" }),
        });
        const { access_token } = await login.json();
        const tx = await fetch(API + "/transactions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + access_token,
          },
          body: JSON.stringify({
            source: "acc-client-001",
            destination: "acc-merchant-001",
            amount: Number(document.getElementById("amount").value),
          }),
        });
        const body = await tx.json();
        out.textContent = JSON.stringify(body, null, 2);
      } catch (e) {
        out.textContent = "Échec : " + e.message + "\n(le service est peut-être en cours de remédiation)";
      }
    }

    document.getElementById("pay").addEventListener("click", pay);
    refreshStatus();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
