# WAF / reverse-proxy applicatif — Resilience-Alpha
# Rôle : seul point d'entrée exposé du SI. Applique un filtrage applicatif
# simple (limitation de débit, blocage de patterns d'injection évidents,
# masquage des services internes) devant l'API métier.
#
# NB pédagogique : un vrai WAF (ModSecurity + CRS OWASP) irait plus loin. Ici,
# on reste volontairement lisible pour le jury : chaque règle est explicable.

# Limitation de débit : amortit un déni de service applicatif. 60 req/s par IP,
# avec une rafale tolérée de 40. Au-delà -> 429 (observable par Prometheus/SIEM).
# Réglé pour une démo à 2 PC : sous un vrai flood réseau, le WAF bloque l'excès
# (429) MAIS laisse passer assez de trafic pour stresser l'API et déclencher la
# détection ML puis la remédiation. C'est la défense en profondeur : chaque
# couche fait sa part.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=60r/s;
limit_req_status 429;

# Journal au format JSON -> récupéré par Promtail et envoyé à Loki/SIEM.
log_format waf_json escape=json
  '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"rt":$request_time,'
  '"ua":"$http_user_agent","blocked":"$waf_blocked"}';

server {
    listen 80;
    server_name _;

    # Logs vers la SORTIE STANDARD : Promtail les récupère et les pousse dans
    # Loki (SIEM). On peut ainsi voir en direct les requêtes bloquées (429).
    access_log /dev/stdout waf_json;

    # --- Durcissement : en-têtes de sécurité -------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    # --- Filtrage applicatif : blocage de signatures d'injection évidentes --
    # Détecte des motifs SQLi / traversée de chemin dans l'URI. Renvoie 403 et
    # marque la requête comme bloquée (-> alerte côté supervision).
    set $waf_blocked "0";
    if ($request_uri ~* "(\bunion\b.+\bselect\b|\bor\b\s+1=1|--\s|/etc/passwd|\.\./)") {
        set $waf_blocked "1";
    }
    if ($args ~* "(<script|onerror=|javascript:)") {
        set $waf_blocked "1";
    }
    # NB : la requête bloquée est déjà tracée par l'access_log du serveur
    # (champ "blocked":"1"). On ne remet pas d'access_log ici : nginx interdit
    # cette directive dans un bloc if.
    if ($waf_blocked = "1") {
        return 403 '{"detail":"Requete bloquee par le WAF"}';
    }

    # --- Proxy vers l'API métier -------------------------------------------
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_pass http://payment-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # --- Proxy vers le service d'authentification --------------------------
    location /auth/ {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_pass http://auth:8100/;
        proxy_set_header Host $host;
    }

    # --- Vitrine marchande (statique) --------------------------------------
    location / {
        proxy_pass http://storefront:80/;
    }

    # Les services internes (db, prometheus, loki, vault…) ne sont JAMAIS
    # exposés ici : ils ne sont accessibles que sur le réseau interne Docker.
}
