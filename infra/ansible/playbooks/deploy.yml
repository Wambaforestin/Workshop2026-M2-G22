---
# Déploiement reproductible de la plateforme sur le PC Hôte.
- name: Déployer Resilience-Alpha
  hosts: host
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}/../../.."
  tasks:
    - name: Vérifier que Docker est disponible
      ansible.builtin.command: docker version
      changed_when: false

    - name: Construire et démarrer la plateforme (docker compose)
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ project_dir }}"
      register: compose_up

    - name: Attendre que l'API métier soit saine
      ansible.builtin.uri:
        url: http://localhost:8080/api/health
        status_code: 200
      register: api_health
      retries: 30
      delay: 2
      until: api_health.status == 200

    - name: Résumé
      ansible.builtin.debug:
        msg: "Plateforme déployée. Dashboard: http://localhost:3000 | Vitrine: http://localhost:8080"
