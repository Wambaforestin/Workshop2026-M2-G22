global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8000"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8100"]

  - job_name: ml-detection
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-detection:8200"]

  - job_name: remediation
    metrics_path: /metrics
    static_configs:
      - targets: ["remediation:8300"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
