# Project Resilience-Alpha — orchestration complète du démonstrateur.
# Démarrage : docker compose up -d --build
#
# Réseau : tout est interne (resilience_net). Seuls les ports utiles à la démo
# sont publiés sur localhost. La base et les secrets ne sont jamais exposés.

name: resilience-alpha

networks:
  resilience_net:
    name: resilience_net

volumes:
  db_data:
  grafana_data:
  loki_data:

services:
  # ---------- SI de paiement (DEV) ----------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment}
      POSTGRES_DB: payment
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./payment-si/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [resilience_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Pas de port publié : base jamais exposée au réseau pédagogique.

  auth:
    build: ./payment-si/auth
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-vault}
    networks: [resilience_net]
    ports: ["8100:8100"]   # publié pour la démo (login depuis la vitrine)
    depends_on: [db]

  payment-api:
    build: ./payment-si/api
    environment:
      DATABASE_URL: postgresql+psycopg2://payment:${POSTGRES_PASSWORD:-payment}@db:5432/payment
      AUTH_URL: http://auth:8100
    networks: [resilience_net]
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  storefront:
    build: ./payment-si/frontend
    networks: [resilience_net]

  # ---------- WAF (seul point d'entrée exposé) ----------
  waf:
    build: ./infra/waf
    networks: [resilience_net]
    ports: ["8080:80"]     # vitrine + /api + /auth passent par ici
    depends_on: [payment-api, auth, storefront]

  # ---------- Observabilité ----------
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [resilience_net]
    ports: ["127.0.0.1:9090:9090"]

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [resilience_net]

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [resilience_net]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [resilience_net]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki]

  # ---------- IA ----------
  ml-detection:
    build: ./ml-detection
    environment:
      PROM_URL: http://prometheus:9090
      REMEDIATION_URL: http://remediation:8300
    networks: [resilience_net]
    ports: ["127.0.0.1:8200:8200"]
    depends_on: [prometheus]

  rag-assistant:
    build: ./rag-assistant
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    networks: [resilience_net]
    ports: ["127.0.0.1:8400:8400"]

  # Ollama : LLM local pour le RAG. Optionnel (profil "ia").
  # Démarrage : docker compose --profile ia up -d
  # Puis : docker exec -it resilience-alpha-ollama-1 ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["ia"]
    volumes:
      - ./rag-assistant/ollama_models:/root/.ollama
    networks: [resilience_net]
    ports: ["127.0.0.1:11434:11434"]

  # ---------- Remédiation + supervision ----------
  remediation:
    build: ./remediation
    environment:
      API_HEALTH_URL: http://payment-api:8000/health/deep
      AUTH_URL: http://auth:8100
      PAYMENT_URL: http://payment-api:8000
      REMEDIATION_NETWORK: resilience_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # droits élevés (cf. hardening.md)
    networks: [resilience_net]
    ports: ["127.0.0.1:8300:8300"]
    depends_on: [payment-api]

  dashboard:
    build: ./dashboard
    networks: [resilience_net]
    ports: ["3001:80"]     # tableau de bord React/Tailwind
